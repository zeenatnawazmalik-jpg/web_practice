<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0d1117 0%, #1a2332 100%);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      color: #e6edf3;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 6px;
    }

    .card .sub {
      text-align: center;
      color: #8b949e;
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
      position: relative;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    .field input.invalid {
      border-color: #f85149;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 36px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .toggle:hover { color: #58a6ff; }

    .error {
      color: #f85149;
      font-size: 0.75rem;
      margin-top: 5px;
      display: none;
    }

    .error.show { display: block; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      margin-bottom: 22px;
    }

    .row label {
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .row a {
      color: #58a6ff;
      text-decoration: none;
    }

    .row a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #238636, #2ea043);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }

    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 16px;
      min-height: 20px;
    }

    .msg.ok { color: #3fb950; }
    .msg.bad { color: #f85149; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" novalidate>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <p class="error" id="emailErr">Please enter a valid email.</p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" />
      <button type="button" class="toggle" id="toggleBtn" onclick="togglePass()">Show</button>
      <p class="error" id="passErr">Password must be at least 6 characters.</p>
    </div>

    <div class="row">
      <label><input type="checkbox" id="remember" /> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn" id="submitBtn">Sign In</button>
    <p class="msg" id="msg"></p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailErr = document.getElementById('emailErr');
    const passErr = document.getElementById('passErr');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    // Live validation — clear error as user types
    email.addEventListener('input', () => {
      email.classList.remove('invalid');
      emailErr.classList.remove('show');
    });
    password.addEventListener('input', () => {
      password.classList.remove('invalid');
      passErr.classList.remove('show');
    });

    function togglePass() {
      const btn = document.getElementById('toggleBtn');
      if (password.type === 'password') {
        password.type = 'text';
        btn.textContent = 'Hide';
      } else {
        password.type = 'password';
        btn.textContent = 'Show';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';

      let valid = true;

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      if (!emailOk) {
        email.classList.add('invalid');
        emailErr.classList.add('show');
        valid = false;
      }

      if (password.value.length < 6) {
        password.classList.add('invalid');
        passErr.classList.add('show');
        valid = false;
      }

      if (!valid) return;

      // Fake login — replace with real logic later
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        msg.textContent = '✓ Login successful (demo only)';
        msg.className = 'msg ok';
      }, 900);
    });
  </script>
</body>
</html>
